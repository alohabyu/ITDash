# Load-balances across every ITDash replica.
# Docker's DNS returns one address per replica for the name "itdash".
upstream itdash {
    server itdash:3000;
    keepalive 32;
}

server {
    listen 80;

    location / {
        proxy_pass http://itdash;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # cards stream in as they load — don't hold the response back
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # static assets are content-hashed: safe to cache hard
    location /_next/static/ {
        proxy_pass http://itdash;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
