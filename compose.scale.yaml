# Several ITDash replicas behind nginx (needs Docker Compose 2.24+ for !reset).
#   docker compose -f compose.yaml -f compose.scale.yaml up -d --build --scale itdash=3
# Dashboard is then on http://<host>:8080
services:
  itdash:
    ports: !reset []              # replicas are reached through the proxy only

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      itdash:
        condition: service_healthy
    restart: unless-stopped
